spring:
  application:
    name: blog
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: create # Automatically reset the DB and build tables from the JPA entities on application startup. Development only.
    open-in-view: false # Disable the ability to query the database from thymeleaf files.

management:

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  observations:
    annotations:
      enabled: true

  management:
    otlp:
      metrics:
        export:
          url: http://localhost:4318/v1/metrics

blog:
  data:
    comments: 100
    posts: 20
    users: 200
    enabled: true
