<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register</title></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<h1>Register</h1>
<p th:if="${error}" class="error" th:text="${error}"></p>
<form method="post" th:action="@{/register}" th:object="${registerRequest}">
    <label>Username</label>
    <input th:field="*{username}" required>
    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></p>
    <label>Password</label>
    <input type="password" th:field="*{password}" required>
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></p>
    <button>Register</button>
</form>
</body>
</html>
