services:

  blog:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    command: ./mvnw spring-boot:run
    volumes:
      - .:/workspace
      - maven-repository:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      # Without actuator:
      # test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  k6:
    image: grafana/k6:2.2.0
    user: "1000:1000"
    network_mode: host
    working_dir: /app
    volumes:
      # Compose resolves relative bind mounts from this file's directory.
      - ../k6:/app
    command: run --summary-export=result.json blog.js
    depends_on:
      blog:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.30.1
    ports:
      - '3000:3000' # Grafana UI
      - '4318:4318' # OTLP HTTP trace ingestion

  postgres:
    image: 'postgres:15.19'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  maven-repository:
